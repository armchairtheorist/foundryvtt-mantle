name: Release

# Publishes a release when you push a version tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# It stamps the tag's version into system.json, builds the compendium packs,
# zips the system, and attaches both the zip and the manifest to a GitHub
# Release. Foundry installs from the manifest URL and updates itself from there.

on:
  push:
    tags:
      - "v*"
  # Lets a release be rebuilt from the Actions tab without cutting a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A broken template or a missing localization key would only show up
      # mid-session, so a failing check must block the release rather than ship.
      - name: Verify
        run: npm run verify

      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version and download URL into the manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const { VERSION, REPO } = process.env;
            const manifest = JSON.parse(await readFile("system.json", "utf8"));
            manifest.version = VERSION;
            manifest.download =
              `https://github.com/${REPO}/releases/download/v${VERSION}/mantle.zip`;
            await writeFile("system.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Build compendium packs
        run: npm run build:packs

      - name: Package the system
        run: |
          # Include only paths that exist — templates/ and packs/ are absent
          # until there is content to put in them — but still fail loudly if
          # zip itself errors, so a broken archive never reaches a release.
          set -euo pipefail
          included=()
          for p in system.json mantle.mjs module templates styles lang assets packs README.md LICENSE; do
            if [ -e "$p" ]; then included+=("$p"); fi
          done
          printf 'Packaging: %s\n' "${included[*]}"
          zip -r mantle.zip "${included[@]}" --exclude "*.DS_Store"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Mantle ${{ inputs.tag || github.ref_name }}
          files: |
            mantle.zip
            system.json
          generate_release_notes: true

          # system.json's manifest URL points at releases/latest, and GitHub
          # excludes pre-releases from "latest". This action infers pre-release
          # from a tag like v0.1.0-alpha, which silently 404s the manifest and
          # breaks Foundry's update check. Say it explicitly instead of letting
          # the tag name decide.
          prerelease: false
          make_latest: true
